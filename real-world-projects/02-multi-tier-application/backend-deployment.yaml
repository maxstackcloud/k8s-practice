apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webapp-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: docker.io/maxstackcloud/k8s-backend:v1
          ports:
            - containerPort: 8080
