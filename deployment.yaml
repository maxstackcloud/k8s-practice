apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: k8-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # Required Node affinity: “You must use this node” ***************************************

      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: kubernetes.io/hostname
      #               operator: In
      #               values:
      #                 - minikube-m03

      # Preferred Node affinity: “Use this node if possible”
      # affinity:
      #   nodeAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #       - weight: 100
      #         preference:
      #           matchExpressions:
      #             - key: kubernetes.io/hostname
      #               operator: In
      #               values:
      #                 #               - nonexistent-node
      #                 - minikube-m02

      # Preferred pod anti-affinity
      # affinity:
      #   podAntiAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #       - weight: 100
      #         podAffinityTerm:
      #           labelSelector:
      #             matchLabels:
      #               app: nginx
      #           topologyKey: kubernetes.io/hostname

      # Required pod anti-affinity
      # affinity:
      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       - labelSelector:
      #           matchLabels:
      #             app: nginx
      #         topologyKey: kubernetes.io/hostname
      tolerations:
        - key: dedicated
          operator: Equal
          value: nginx
          effect: NoSchedule
      volumes:
        - name: nginx-html
          configMap:
            name: nginx-file-config
      containers:
        - name: nginx
          image: nginx:stable
          envFrom:
            - configMapRef:
                name: nginx-config
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
